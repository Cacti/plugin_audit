name: Plugin Integration Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  integration-test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        os: [ubuntu-latest]
        cacti_branch: ['1.2.x', 'develop']
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: cactiroot
          MYSQL_DATABASE: cacti
          MYSQL_USER: cactiuser
          MYSQL_PASSWORD: cactiuser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    name: PHP ${{ matrix.php }} Integration Test (Cacti ${{ matrix.cacti_branch }}) on ${{ matrix.os }}
    
    steps:
    - name: Checkout Cacti
      uses: actions/checkout@v7
      with:
        repository: Cacti/cacti
        ref: ${{ matrix.cacti_branch }}
        path: cacti
    
    - name: Checkout audit Plugin
      uses: actions/checkout@v7
      with:
        path: cacti/plugins/audit
    
    - name: Install PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: intl, mysql, gd, ldap, gmp, xml, curl, json, mbstring
        ini-values: "post_max_size=256M, max_execution_time=60, date.timezone=America/New_York"
    
    - name: Check PHP version
      run: php -v
    
    - name: Run apt-get update
      run: sudo apt-get update
    
    - name: Install System Dependencies
      run: sudo apt-get install -y apache2 snmp snmpd rrdtool fping
    
    - name: Start SNMPD Agent and Test
      run: |
        sudo systemctl start snmpd
        sudo snmpwalk -c public -v2c -On localhost .1.3.6.1.2.1.1
    
    - name: Setup Permissions
      run: |
        sudo chown -R www-data:runner ${{ github.workspace }}/cacti
        sudo find ${{ github.workspace }}/cacti -type d -exec chmod 775 {} \;
        sudo find ${{ github.workspace }}/cacti -type f -exec chmod 664 {} \;
        sudo chmod +x ${{ github.workspace }}/cacti/cmd.php
        sudo chmod +x ${{ github.workspace }}/cacti/poller.php
    
    - name: Create MySQL Config
      run: |
        echo -e "[client]\nuser = root\npassword = cactiroot\nhost = 127.0.0.1\n" > ~/.my.cnf
        cat ~/.my.cnf
    
    - name: Initialize Cacti Database
      env:
        MYSQL_AUTH_USR: '--defaults-file=~/.my.cnf'
      run: |
        mysql $MYSQL_AUTH_USR -e 'CREATE DATABASE IF NOT EXISTS cacti;'
        mysql $MYSQL_AUTH_USR -e "CREATE USER IF NOT EXISTS 'cactiuser'@'localhost' IDENTIFIED BY 'cactiuser';"
        mysql $MYSQL_AUTH_USR -e "GRANT ALL PRIVILEGES ON cacti.* TO 'cactiuser'@'localhost';"
        mysql $MYSQL_AUTH_USR -e "GRANT SELECT ON mysql.time_zone_name TO 'cactiuser'@'localhost';"
        mysql $MYSQL_AUTH_USR -e "FLUSH PRIVILEGES;"
        mysql $MYSQL_AUTH_USR cacti < ${{ github.workspace }}/cacti/cacti.sql
        mysql $MYSQL_AUTH_USR -e "INSERT INTO settings (name, value) VALUES ('path_php_binary', '/usr/bin/php')" cacti
    
    - name: Validate composer files
      run: |
        cd ${{ github.workspace }}/cacti
        if [ -f composer.json ]; then
          composer validate --strict || true
        fi
    
    - name: Install Composer Dependencies
      run: |
        cd ${{ github.workspace }}/cacti
        if [ -f composer.json ]; then
          sudo composer install --prefer-dist --no-progress
        fi
    
    - name: Create Cacti config.php
      run: |
        cat ${{ github.workspace }}/cacti/include/config.php.dist | \
        sed -r "s/localhost/127.0.0.1/g" | \
        sed -r "s/'cacti'/'cacti'/g" | \
        sed -r "s/'cactiuser'/'cactiuser'/g" | \
        sed -r "s/'cactiuser'/'cactiuser'/g" > ${{ github.workspace }}/cacti/include/config.php
        sudo chmod 664 ${{ github.workspace }}/cacti/include/config.php
    
    - name: Configure Apache
      run: |
        cat << 'EOF' | sed 's#GITHUB_WORKSPACE#${{ github.workspace }}#g' > /tmp/cacti.conf
        <VirtualHost *:80>
          ServerAdmin webmaster@localhost
          DocumentRoot GITHUB_WORKSPACE/cacti
          
          <Directory GITHUB_WORKSPACE/cacti>
            Options Indexes FollowSymLinks
            AllowOverride All
            Require all granted
          </Directory>
          
          ErrorLog ${APACHE_LOG_DIR}/error.log
          CustomLog ${APACHE_LOG_DIR}/access.log combined
        </VirtualHost>
        EOF
        sudo cp /tmp/cacti.conf /etc/apache2/sites-available/000-default.conf
        sudo systemctl restart apache2
    
    - name: Install Cacti via CLI
      run: |
        cd ${{ github.workspace }}/cacti
        sudo php cli/install_cacti.php --accept-eula --install --force
    
    - name: Install Audit Plugin
      run: |
        cd ${{ github.workspace }}/cacti
        sudo php cli/plugin_manage.php --plugin=audit --install --enable

    - name: Verify Audit Schema
      run: |
        COLUMN_COUNT=$(mysql -u cactiuser -p'cactiuser' -h 127.0.0.1 cacti -se "
          SELECT COUNT(*)
          FROM information_schema.columns
          WHERE table_schema = 'cacti'
            AND table_name = 'audit_log'
            AND column_name IN ('request_status', 'external_status', 'external_error');
        ")
        if [ "$COLUMN_COUNT" -ne 3 ]; then
          echo "Audit schema security columns are missing"
          exit 1
        fi

        SYSLOG_TABLE_COUNT=$(mysql -u cactiuser -p'cactiuser' -h 127.0.0.1 cacti -se "
          SELECT COUNT(*)
          FROM information_schema.tables
          WHERE table_schema = 'cacti'
            AND table_name = 'audit_syslog_delivery';
        ")
        if [ "$SYSLOG_TABLE_COUNT" -ne 1 ]; then
          echo "Audit Syslog delivery queue table is missing"
          exit 1
        fi

        AUTH_STATE_TABLE_COUNT=$(mysql -u cactiuser -p'cactiuser' -h 127.0.0.1 cacti -se "
          SELECT COUNT(*)
          FROM information_schema.tables
          WHERE table_schema = 'cacti'
            AND table_name = 'audit_user_log_state';
        ")
        if [ "$AUTH_STATE_TABLE_COUNT" -ne 1 ]; then
          echo "Authentication deduplication state table is missing"
          exit 1
        fi

        AUTH_STATE_FK_COUNT=$(mysql -u cactiuser -p'cactiuser' -h 127.0.0.1 cacti -se "
          SELECT COUNT(*)
          FROM information_schema.table_constraints
          WHERE constraint_schema = 'cacti'
            AND table_name = 'audit_user_log_state'
            AND constraint_type = 'FOREIGN KEY';
        ")
        if [ "$AUTH_STATE_FK_COUNT" -ne 0 ]; then
          echo "Authentication deduplication state must survive audit-log purges"
          exit 1
        fi

        THROTTLE_SETTING_COUNT=$(mysql -u cactiuser -p'cactiuser' -h 127.0.0.1 cacti -se "
          SELECT COUNT(*)
          FROM settings
          WHERE name = 'audit_brute_force_last_alert';
        ")
        if [ "$THROTTLE_SETTING_COUNT" -ne 1 ]; then
          echo "Brute-force throttle setting was not initialized"
          exit 1
        fi
    
    - name: Check PHP Syntax for Plugin
      run: |
        cd ${{ github.workspace }}/cacti/plugins/audit
        if find . -name '*.php' -exec php -l {} 2>&1 \; | grep -iv 'no syntax errors detected'; then
          echo "Syntax errors found!"
          exit 1
        fi

    - name: Run Audit Security Helper Tests
      run: |
        cd ${{ github.workspace }}/cacti/plugins/audit
        php tests/security_functions_test.php
        php tests/controller_security_test.php
        php tests/syslog_functions_test.php
        php tests/syslog_queue_test.php
        php tests/auth_audit_test.php
    
    - name: Run Cacti Poller
      run: |
        cd ${{ github.workspace }}/cacti
        sudo php poller.php --poller=1 --force --debug
        if ! grep -q "SYSTEM STATS" log/cacti.log; then
          echo "Cacti poller did not finish successfully"
          cat log/cacti.log
          exit 1
        fi
    
    - name: View Cacti Logs
      if: always()
      run: |
        if [ -f ${{ github.workspace }}/cacti/log/cacti.log ]; then
          echo "=== Cacti Log ==="
          sudo cat ${{ github.workspace }}/cacti/log/cacti.log
        fi

    - name: enable audit plugin logging
      run: |
        cd ${{ github.workspace }}
        ENABLE_AUDIT_LOGGING="update settings set value = 'on' where name = 'audit_enabled' or name = 'audit_log_external';"
        mysql -u cactiuser -p'cactiuser' -h 127.0.0.1 cacti -e "$ENABLE_AUDIT_LOGGING"

    - name: Run cli script to trigger audit log entry
      run: |
        cd ${{ github.workspace }}/cacti
        sudo php cli/add_device.php --description=test --ip=1

    - name: Exercise authentication ingestion
      run: |
        mysql -u cactiuser -p'cactiuser' -h 127.0.0.1 cacti -e "
          INSERT INTO user_log (username, user_id, time, result, ip)
          VALUES ('audit_ci_login', 0, NOW(), 0, '192.0.2.10')
          ON DUPLICATE KEY UPDATE result = VALUES(result), ip = VALUES(ip);
        "
        cd ${{ github.workspace }}/cacti
        sudo php poller.php --poller=1 --force --debug

        AUTH_EVENT_COUNT=$(mysql -u cactiuser -p'cactiuser' -h 127.0.0.1 cacti -se "
          SELECT COUNT(*)
          FROM audit_log
          WHERE event_type = 'cacti.auth.login.failed'
            AND target_id = 'audit_ci_login';
        ")
        AUTH_STATE_COUNT=$(mysql -u cactiuser -p'cactiuser' -h 127.0.0.1 cacti -se "
          SELECT COUNT(*)
          FROM audit_user_log_state
          WHERE source_hash = SHA2(
            CONCAT('audit_ci_login', '|', 0, '|', (
              SELECT time FROM user_log
              WHERE username = 'audit_ci_login' AND user_id = 0
              ORDER BY time DESC LIMIT 1
            )),
            256
          );
        ")

        if [ "$AUTH_EVENT_COUNT" -ne 1 ] || [ "$AUTH_STATE_COUNT" -ne 1 ]; then
          echo "Authentication ingestion did not atomically create one event and one state marker"
          exit 1
        fi

        mysql -u cactiuser -p'cactiuser' -h 127.0.0.1 cacti -e "
          DELETE FROM audit_log
          WHERE event_type = 'cacti.auth.login.failed'
            AND target_id = 'audit_ci_login';
        "
        sudo php poller.php --poller=1 --force --debug

        REPLAYED_EVENT_COUNT=$(mysql -u cactiuser -p'cactiuser' -h 127.0.0.1 cacti -se "
          SELECT COUNT(*)
          FROM audit_log
          WHERE event_type = 'cacti.auth.login.failed'
            AND target_id = 'audit_ci_login';
        ")
        if [ "$REPLAYED_EVENT_COUNT" -ne 0 ]; then
          echo "Authentication source row was replayed after audit-log deletion"
          exit 1
        fi

    - name: check audit log entries
      run: |
        cd ${{ github.workspace }}
        AUDIT_LOG_COUNT=$(mysql -u cactiuser -p'cactiuser' -h 127.0.0.1 cacti -se "select count(*) from audit_log;")
        echo "Audit log entry count: $AUDIT_LOG_COUNT"
        if [ "$AUDIT_LOG_COUNT" -lt 1 ]; then
          echo "No audit log entries found!"
          exit 1
        fi

        CLI_STATUS=$(mysql -u cactiuser -p'cactiuser' -h 127.0.0.1 cacti -se "select request_status from audit_log where action = 'cli' order by id desc limit 1;")
        if [ "$CLI_STATUS" != "completed" ]; then
          echo "Unexpected CLI request status: $CLI_STATUS"
          exit 1
        fi
